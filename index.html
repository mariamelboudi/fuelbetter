<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fuel Better</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .hero {
      min-height: 100vh;
      background-image: url("hero.jpg");
      background-size: cover;
      background-position: center;
      
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: white;
      font-size: clamp(40px, 7vw, 80px);
      margin: 0 0 40px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .button {
      display: inline-block;
      padding: 16px 32px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <main class="hero">

    <h1>Fuel Better</h1>

    <div class="buttons">
      <a href="#" class="button">Button 1</a>
      <a href="#" class="button">Button 2</a>
    </div>

  </main>

</body>
</html>
